services:
  postgres:
    image: postgres:16-alpine
    container_name: savorai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: savorai
      POSTGRES_PASSWORD: savorai
      POSTGRES_DB: savorai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savorai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
